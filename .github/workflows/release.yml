name: windows-release
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Android build workload
        run: dotnet workload install maui-android
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Android APK
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $arguments = @()
          $keystore = $null
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Release tags must use vMAJOR.MINOR.PATCH.' }
          $parts = $version.Split('.')
          $versionCode = ([int]$parts[0] * 1000000) + ([int]$parts[1] * 1000) + [int]$parts[2]
          try {
            if ($env:ANDROID_KEYSTORE_BASE64 -and $env:ANDROID_KEYSTORE_PASSWORD -and $env:ANDROID_KEY_ALIAS -and $env:ANDROID_KEY_PASSWORD) {
              $keystore = Join-Path $env:RUNNER_TEMP 'safenotify-release.keystore'
              [System.IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
              $arguments = @(
                '-p:AndroidKeyStore=true',
                "-p:AndroidSigningKeyStore=$keystore",
                "-p:AndroidSigningStorePass=$env:ANDROID_KEYSTORE_PASSWORD",
                "-p:AndroidSigningKeyAlias=$env:ANDROID_KEY_ALIAS",
                "-p:AndroidSigningKeyPass=$env:ANDROID_KEY_PASSWORD"
              )
            }
            dotnet publish src/SafeNotify.Android/SafeNotify.Android.csproj --configuration Release -p:AndroidPackageFormat=apk -p:EmbedAssembliesIntoApk=true "-p:ApplicationDisplayVersion=$version" "-p:ApplicationVersion=$versionCode" @arguments
            if ($LASTEXITCODE -ne 0) { throw 'Android APK build failed.' }
          }
          finally {
            if ($keystore -and (Test-Path $keystore)) { Remove-Item $keystore -Force }
          }
      - name: Prepare Android release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path publish/release -Force | Out-Null
          Copy-Item src/SafeNotify.Android/bin/Release/net10.0-android/org.safenotify.client-Signed.apk publish/release/SafeNotify-Android-client.apk
      - name: Build installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Release tags must use vMAJOR.MINOR.PATCH." }
          ./scripts/Build-Installer.ps1 -Version $version
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SafeNotify ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            publish/installer/SafeNotify-Setup-*-win-x64.exe
            publish/release/SafeNotify-Android-client.apk
